# Serves the Angular app and proxies /api to the API, so the browser sees
# a single origin and the same-site auth and CSRF cookies keep working.

# Keep the scheme set by a TLS-terminating load balancer; fall back to
# nginx's own when it is the first hop.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    client_max_body_size 6m;   # CSV imports are capped at 5 MB by the API

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://${API_UPSTREAM};
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 120s;   # first bank sync after linking can be slow
    }

    location /health/ {
        proxy_pass http://${API_UPSTREAM};
    }

    # Hashed build files never change, so cache them for a year.
    location ~* \.(?:js|css|woff2?|png|svg|ico)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Client-side routes fall back to the app. index.html is never cached
    # so a deploy takes effect on the next page load.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
