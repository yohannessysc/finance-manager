# Included in every location: nginx drops server-level add_header lines in
# any location that sets its own headers.
# Plaid Link loads its script from cdn.plaid.com and runs in a Plaid iframe.
# Angular injects component styles inline, hence style-src 'unsafe-inline'.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.plaid.com; frame-src https://cdn.plaid.com https://*.plaid.com; connect-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
